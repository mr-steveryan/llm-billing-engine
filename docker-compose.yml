services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "127.0.0.1:5432:5432"  # localhost only: the DB password is public in this repo
    volumes:
      - pgdata:/var/lib/postgresql
      # Not in docker-entrypoint-initdb.d: the API applies migrations at startup, and seeding is the separate Seed step.
      - ./seed.sql:/seed/seed.sql:ro
    healthcheck:
      # TCP, not the socket: the init-time temp server on first start listens only on the socket
      test: ["CMD-SHELL", "pg_isready -h localhost -U billing -d billing"]
      interval: 2s
      retries: 15

  api:
    build: .
    env_file: .env  # Razorpay keys; gitignored, never baked into the image
    environment:
      DATABASE_URL: postgresql://billing:billing@db:5432/billing
    ports:
      - "127.0.0.1:8000:8000"  # localhost only; ngrok also connects via localhost
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy only once /health answers (it queries the DB), so `up --wait` returns when requests will work.
      # Python's urllib because the slim image has no curl; 127.0.0.1 because uvicorn listens on IPv4 only.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
